<html>

<head>
    <script>
        function validate() {
            var name = document.getElementById("name").value;
            err1 = document.getElementById("err1");

            if (name == "") {
                err1.innerHTML = "*Name is required";
                err1.style.color = "red";
                return false;
            }
            else {
                err1.innerHTML = "✅✅✅✅";
                err1.style.color = "green";
                return true;
            }
        }

        function onlyChar() {
            let name = document.getElementById("name").value;
            let err1 = document.getElementById("err1");

            if (/^[a-zA-Z ]*$/.test(name)) {
                err1.innerhtml = "";
            }
            else {
                err1.innerHTML = "*Only alphabets allowed";
                err1.style.color = "red";
            }
        }
    </script>
</head>

<body>
    <!-- <form>
        <label>Name</label>
        <input type="text" id="name" onkeyup="onlyChar()"> 
        <span id="err1"></span>
        <br><br>
        <button onclick="return validate()">Register</button>
    </form> -->

    <form onsubmit="return validate()">
        <label>Name</label>
        <input type="text" id="name" onkeyup="onlyChar()">
        <span id="err1"></span>
        <br><br>
        <button type="submit">Register</button>
    </form>
</body>

</html>
